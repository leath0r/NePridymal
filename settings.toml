# ============================================================
#  Настройки NePridymal. Меняй числа, сохраняй файл и перезапускай игру.
#  Удалил строку — вернётся значение по умолчанию (оно и записано здесь).
#  Опечатка в файле — игра не упадёт, а возьмёт значения по умолчанию и напишет об этом в окне.
#
#  «Возврат игроку» (edge): 0.96 = на дистанции игрокам возвращается 96% ставок, казино берёт 4%.
#  Больше 1.0 — казино начинает раздавать звёзды (игроки будут в плюсе на дистанции). Не ставь ≥ 1.
#  Шансы игр можно менять и прямо в игре: Админка → «Шансы» (действует сразу, важнее этого файла).
# ============================================================

[start]
start_stars = 5000          # звёзд новому игроку (при вайпе своя настройка в wipecfg, тоже 5000)
ref_bonus = 500            # за приглашённого друга
free_case_hours = 12.0       # бесплатный кейс раз в N часов
daily_hours = 20.0          # бонус дня раз в N часов
daily_scale = 0.3           # множитель бонуса дня

[games]
edge = 0.94                 # кубик, лимбо, башня — возврат игроку
crash_edge = 0.94           # краш
mines_edge = 0.94           # мины
chicken_edge = 0.94         # курица
hilo_edge = 0.94            # больше/меньше
upgrade_edge = 0.88         # апгрейд: шанс = ставка / цель × это число
upgrade_max = 0.7           # апгрейд: максимальный шанс (80%)
slots_rtp = 0.90            # слоты (было 0.94 — урезали 11.10.2026)
avia_rtp = 0.94             # самолётик
wheel_rtp = 0.92           # колесо фортуны (множители секторов масштабируются)
scratch_rtp = 0.92          # скретч-карты
claw_rtp = 0.93             # кран (автомат с клешнёй): шанс удержать приз = это число / множитель
pump_rtp = 0.94             # насос: шар лопается всё чаще, множитель оплачивает риск
plinko_rtp = 0.94           # плинко: множители лунок масштабируются под это число
drill_rtp = 0.94            # бур: множители пластов масштабируются под это число
darts_rtp = 0.94            # дартс: множители зон масштабируются под это число
fish_rtp = 0.94             # рыбалка (одиночный краш): P(дотянуть до x) = это число / x
keno_rtp = 0.94             # кено: таблицы выплат масштабируются под это число
penalty_rtp = 0.94          # пенальти: множитель после n голов = это число / P(гол)^n
dogs_scale = 0.385          # пёсики: множитель выплат (возврат ≈ число × 2,43: 0.405 ≈ 98,4%; 0.395 ≈ 96%). Не выше 0.41!
carousel_rtp = 0.94         # карусель: возврат игроку
carousel_max = 200000       # карусель: максимум ставок игрока на раунд
ladder_rtp = 0.94           # лестница: возврат игроку
safe_rtp = 0.94             # сейф: возврат игроку, включая 2% общего фонда
bankbet_rake = 0.08         # ставка на банк: комиссия банка с выигрыша
bankbet_max = 100000        # ставка на банк: максимум на раунд
forecast_rake = 0.08        # прогноз дня: комиссия банка с выигрыша
forecast_max = 100000       # прогноз дня: максимум на один рынок
max_bet = 1000000           # максимальная ставка в играх

[economy]
case_rtp = 0.82             # кейсы: средний возврат (цена кейса считается от этого)
sell_rate = 0.70            # продажа подарка казино: доля от ценности
market_fee = 0.10           # комиссия маркета
trade_fee = 0.10            # комиссия со звёзд в обменах
transfer_fee = 0.08         # «Кошелёк»: комиссия перевода по QR (платит отправитель сверху суммы)
transfer_min = 10           # минимальный перевод
transfer_day_count = 50     # переводов в сутки с одного аккаунта
transfer_max = 0            # максимум за один перевод (0 — без ограничения)
# все настройки переводов можно менять на лету: Админка → вкладка «Переводы»
duel_fee = 0.08             # комиссия дуэлей
income_tax = 0.20           # налог с пассивного дохода
gift_income = 0.004          # доход подарков: доля ценности в сутки
lucky_chance = 0.001        # «удачный момент»: шанс сюрприза после раунда (не чаще раза в сутки)
bigwin_min = 3000           # с какой суммы выигрыш попадает в ленту крупных выигрышей
bigwin_fee = 0.01           # сбор банка с выигрышей от bigwin_fee_min
bigwin_fee_min = 10000
reward_scale = 0.5          # множитель наград за задания и уровни
biz_margin = 0.24           # бизнесы: базовая наценка партии (умножается на спрос, цепочку и курс банка)
biz_batch_small = 0.25      # размер партии на 1 уровне как доля цены: бизнесы дешевле 100 000
biz_batch_mid = 0.15        # от 100 000 до 1 000 000
biz_batch_big = 0.10        # от 1 000 000 до 5 000 000
biz_batch_huge = 0.07       # от 5 000 000
biz_scale = 0.25            # множитель дохода всех бизнесов (1 — как до обновления)
biz_sell = 0.30             # продажа бизнеса: доля вложенного
stake_scale = 0.3           # множитель доходности гибкого стейкинга (BTC 0,9%/сут, NOT 1,8%/сут)
stake_cap_days = 0          # сколько суток копится награда без сбора; 0 — без ограничения, капает каждую секунду
stake_mult_3d = 2.0         # вклад на 3 дня: ставка выше во столько раз
stake_mult_7d = 3.0         # вклад на 7 дней
stake_mult_30d = 4.0        # вклад на 30 дней
vault_1d = 0.004            # сейф подарка: доход за 1 день
vault_3d = 0.015             # за 3 дня
vault_7d = 0.04             # за 7 дней
crypto_fee = 0.005          # комиссия биржи с каждой сделки
swap_fee = 0.007            # обмен монета → монета
fut_fee = 0.003             # фьючерсы: от объёма при открытии и при закрытии

[jackpot]
ticket = 100                # цена билета розыгрыша банка
house_share = 0.10          # доля дневной прибыли казино в фонд розыгрыша
split = [0.60, 0.25, 0.15]  # доли призов за 1, 2, 3 место
free_cap = 50               # максимум бесплатных билетов за игру в день

[cashback]
rate = 0.02                 # кэшбэк недели: доля чистого проигрыша
min_loss = 2000             # с какого минуса за неделю платим
max = 250000                # потолок кэшбэка на игрока

[comeback]
case = "starter"            # ключ от какого кейса дарим вернувшимся (id кейса)

[clans]
create_cost = 5000          # цена создания клана
war_prizes = [25000, 12000, 5000]   # призы битвы кланов за 1–3 место
level_bonus = 0.02          # +доход за каждый уровень клана

[shop]
rate = 1000                 # игровых звёзд за 1 Telegram Star
first_bonus = 1.0           # бонус первой покупки (+100%)
first_cap = 250000          # но не больше стольких звёзд
vip_sub_xtr = 299           # VIP-подписка: Telegram Stars за 30 дней с автопродлением (разовый VIP на 7 дней — 99, в коде)

[loyalty]
per = 200                   # игровых звёзд оборота (ставок) за 1 очко; 1 очко ≈ 1 звезда в магазине очков → 0,5% оборота
day_cap = 50000             # очков в сутки одному игроку, не больше
silver = 20000              # накоплено очков за всё время → серебро: очки идут на 25% быстрее
gold = 100000               # золото: на 50% быстрее

[birthday]
notice_days = 30            # подарок в день рождения, только если дата указана не позже чем за столько дней до него
level = 3                   # с какого уровня положен подарок
case = "lux"                # ключ от этого кейса — подарок именинникам

[tourn]
pool = 40000                # призовой фонд турнира недели

[gameday]
pool = 30000                # игра дня: потолок фонда (до поправки на курс банка)
pool_pct = 0.025            # фонд: доля от суммы исходов за день; держать меньше 0,031 (потеря игрока при возврате 94%), иначе накрутка твинками выгодна
min_pts = 50                # меньше очков приза нет

[season]
prizes = [100000, 50000, 30000, 15000, 15000, 10000, 10000, 5000, 5000, 5000]   # призы сезона, места 1–10

[loans]
ltv = 0.4                   # кредит под залог: доля ценности подарка
fee = 0.15                  # базовая ставка; лимит и ставка зависят от рейтинга, таблица в server/loans.py
score_ok = 40               # рейтинг за возврат в срок
score_lost = 150            # рейтинг минус за просрочку
bank_share = 0.05           # без залога одному игроку: не больше этой доли банка
biz_ltv = 0.8               # кредит под бизнес: доля цены продажи (должна быть меньше 1)
auto_share = 0.3            # часть собранного дохода, которая гасит кредит под бизнес
lost_fee = 0.05             # штраф за просрочку кредита без залога
penalty_hours = 48          # после просрочки: столько часов без новых кредитов
penalty_bet = 10000         # и потолок ставки

[franchise]
# Свой бот игрока с этой же игрой (/franchise в боте). База и аккаунты общие.
reward = 25000              # ⭐ владельцу бота — один раз на аккаунт…
reward_players = 10         # …когда через его бота придут столько новых игроков…
reward_level = 5            # …и дорастут до этого уровня (против твинков)
max_per_owner = 5           # ботов на одного игрока (сверх — не подключаются)
max_age_hours = 24          # сколько часов действует вход из бота-франшизы (у главного — 7 дней)

[bank]
crisis_at = 35000000          # банк ниже — кризис: ставки ограничены, дивиденды на паузе
crisis_max_bet = 100000       # потолок ставки в кризис
savior_min = 10000            # столько подарить банку в кризис — титул «Спаситель банка»
level1_at = 50000000          # уровень банка 1 — при таком размере
level2_at = 100000000         # уровень 2
level3_at = 250000000         # уровень 3
deposit_bonus = 0.25          # +к доходности вкладов за каждый уровень банка (+25%)

backing = 0.25                # доля купленных звёзд, добавляемая к банку как обеспечение
faucet_low = 0.6              # если за 7 дней банк в минусе — бонусы и пассивный доход умножаются на это число

[deposit]
# Вклады в банк: звёзды заморожены (банк растёт), проценты капают непрерывно, выплата в конце срока.
# Досрочное изъятие: тело минус комиссия, проценты сгорают. В кризис вклады закрыты.
min = 1000                    # минимальный вклад
max_total = 500000            # сумма всех вкладов игрока
rate1 = 0.002                 # доходность за 1 день (0,2%)
rate3 = 0.008                 # за 3 дня (0,8%)
rate7 = 0.025                 # за 7 дней (2,5%)
early_fee = 0.02              # комиссия за досрочное изъятие (2% тела)

[idletax]
# Сбор за простой (server/idletax.py): кто не заходил idle_days и держит больше floor, раз в неделю отдаёт банку rate с суммы сверх floor
on = true
floor = 5000000
rate = 0.01
idle_days = 14
