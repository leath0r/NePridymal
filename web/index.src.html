<style>
/* экран загрузки: без картинок и внешних файлов, виден сразу */
html{background:#07070c}
.np-boot{--a:var(--ac,#ffc53d);position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(60% 40% at 50% 46%,color-mix(in srgb,var(--a) 26%,transparent),transparent 75%),#07070c;transition:opacity .4s ease}
.npb-logo{position:relative;width:112px;height:112px;display:grid;place-items:center;transition:transform .45s cubic-bezier(.3,0,.2,1)}
.npb-ring{position:absolute;inset:0;transform:rotate(-90deg);animation:npb-spin 1.5s linear infinite}
.npb-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.npb-ring .tr{stroke:#ffffff17}
.npb-ring .pr{stroke:var(--a);stroke-dasharray:60 240;filter:drop-shadow(0 0 6px var(--a))}
.npb-star{width:50px;height:50px;fill:#ffc53d;filter:drop-shadow(0 4px 16px #ffb02e80);animation:npb-in .6s cubic-bezier(.2,1.5,.4,1) both}
.np-boot.out{opacity:0;pointer-events:none}
.np-boot.out .npb-logo{transform:scale(1.5)}
@keyframes npb-spin{to{transform:rotate(270deg)}}
@keyframes npb-in{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.npb-ring,.npb-star{animation:none}}
</style>
